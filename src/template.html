<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Climber Slice</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; background: #0a0d1c; overflow: hidden; }
  #fx { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  #world { position: absolute; left: 0; top: 0; width: 100%; will-change: transform; }
  #stage canvas { position: absolute; display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<div id="stage"></div>

<!-- Built-in starter rooms (level format v1). The game only ever reads rooms as data through loadRoom(). -->
<script type="application/json" id="starter-rooms">[/*ROOM_JSON*/]</script>

<script>
(function () {
  'use strict';

  var LW = 270, LH = 480, STEP = 1 / 60;   // the screen; a room is LW wide and one or two screens tall (RH)
  var RH = LH;
  var K = 1.25; // tiles are 10px, so classic 8px-tile platformer speeds are scaled up by 10/8

  // ---- movement tuning (px and seconds) ----
  var P = {
    maxRun: 90 * K, runAccel: 1000 * K, runReduce: 400 * K, airMult: 0.65,
    gravity: 900 * K, maxFall: 160 * K, wallSlideStart: 20 * K, wallSlideTime: 1.2, halfGravBelow: 40 * K,
    jumpSpeed: -105 * K, jumpHBoost: 40 * K, varJumpTime: 0.2,
    coyote: 0.1, jumpBuffer: 0.1, dashBuffer: 0.08,
    dashSpeed: 240 * K, endDashSpeed: 160 * K, dashTime: 0.15, dashCooldown: 0.2, dashFreeze: 0.05,
    wallJumpH: 130 * K, wallJumpForce: 0.16, wallCheck: 3, wallBoostTime: 0.2,
    superH: 260 * K, hyperH: 325 * K, hyperV: 0.5,   // jump out of a ground dash: a super (long and high) or, holding down, a hyper (longer and low)
    bounceH: 170 * K, bounceV: -160 * K, bounceVarTime: 0.25, bounceForce: 0.2, bounceCheck: 5,   // wall bounce: dash up beside a wall, then jump
    climbUp: -45 * K, climbDown: 80 * K, climbAccel: 900 * K, climbHop: -120 * K,
    stamina: 110, dashCost: 60, climbUpCost: 45.45, climbStillCost: 10, climbJumpCost: 27.5, tiredBelow: 20,
    cornerCorrect: 4, iceGrip: 0.1, crumbleDelay: 0.5, crumbleRespawn: 2.5, moverSpeed: 45, moverWait: 0.4, zipSpeed: 160, zipWind: 0.1, zipRest: 0.5, zipBack: 45, jetOff: 1.3, jetWarn: 0.35, jetOn: 0.75, droneSpeed: 40, droneWait: 0.6, droneFire: 0.3, lavaRise: 5, lavaDelay: 15, springV: -185 * K, fireSpeed: 60, fireWait: 0.15, exitTime: 0.35, dieTime: 0.28, hurtTime: 0.06, spawnTime: 0.3, refillRespawn: 2.5
  };

  var C = {
    bg: '#0a0d1c', dot: '#1b2145', solid: '#36416e', cap: '#93a4de', under: '#262f55',
    spike: '#e9edf7', body: '#ffe9b8', tired: '#c7a58c', eye: '#0a0d1c',
    flame: '#ffb74a', flameOut: '#56608a', hurt: '#ff8f7d', smoke: '#8d9ac0', teal: '#5fd6b3', tealDim: '#2b6f66',
    text: '#eef1fa', dim: '#9aa6cc'
  };

/*SHARED_TILES*/

/*SHARED_HERO*/

/*SHARED_WORLDS*/

  // ---- level loading: rooms are data, never hard-coded ----
/*SHARED_CONFIG*/
  var LIVE_KEY = 'climber.live.v1';
  var starters = JSON.parse(document.getElementById('starter-rooms').textContent); // built-in set, also the offline fallback
  var pool = starters, queue = [];
  // Worlds and levels. Built-in rooms fill every slot; a published level with the same world and number takes that slot over.
  var PROG_KEY = 'climber.progress.v1', prog = {}, levels = [], liveRooms = [], dataVer = 0, unlockAll = location.hash === '#unlock';
  try { prog = JSON.parse(localStorage.getItem(PROG_KEY)) || {}; } catch (e) {}
  function rebuildLevels() {
    levels = WORLDS.map(function (wd, w) {
      // each numbered slot holds the built-in room unless a published level has that number; unnumbered ones go last
      var slot = {}, nums = [], loose = [], i, r, n;
      for (i = 0; i < starters.length; i++) if (worldOf(starters[i]) === w + 1 && starters[i].level > 0) slot[starters[i].level] = starters[i];
      for (i = 0; i < liveRooms.length; i++) { r = liveRooms[i]; if (worldOf(r) === w + 1) { if (r.level > 0) slot[r.level] = r; else loose.push(r); } }
      for (n in slot) nums.push(+n);
      nums.sort(function (a, b) { return a - b; });
      // the saved map order lists slot numbers in the order they should appear; anything it does not mention goes after, in number order
      var want = mapOrder[w + 1] || [], order = [], seen = {};
      for (i = 0; i < want.length; i++) if (slot[want[i]] && !seen[want[i]]) { order.push(want[i]); seen[want[i]] = 1; }
      for (i = 0; i < nums.length; i++) if (!seen[nums[i]]) order.push(nums[i]);
      return order.map(function (k) { return slot[k]; }).concat(loose);
    });
    dataVer++;
  }
  function beaten(r) { return !!prog[r.id]; }
  function worldOpen(w) {
    if (unlockAll || w <= 0) return true;
    for (var i = 0; i < levels[w - 1].length; i++) if (!beaten(levels[w - 1][i])) return false;
    return worldOpen(w - 1);
  }
  function levelOpen(w, i) { return worldOpen(w) && (unlockAll || i === 0 || beaten(levels[w][i - 1])); }
  function endlessPool() {
    var out = [];
    for (var w = 0; w < levels.length; w++) if (worldOpen(w)) out = out.concat(levels[w]);
    return out.length ? out : starters;
  }
  function usable(d) {
    return d && d.format === 1 && d.grid && d.grid.cols * d.grid.tile === LW && (d.grid.rows * d.grid.tile === LH || d.grid.rows * d.grid.tile === 2 * LH) && d.tiles && d.tiles.length === d.grid.rows;
  }
  // The endless run: easier rooms first, shuffled inside each difficulty, then round again.
  function nextFromQueue() {
    if (!queue.length) {
      pool = endlessPool();
      var byDiff = {}, keys = [], i, j, k;
      for (i = 0; i < pool.length; i++) { k = pool[i].difficulty || 1; if (!byDiff[k]) { byDiff[k] = []; keys.push(k); } byDiff[k].push(pool[i]); }
      keys.sort(function (a, b) { return a - b; });
      for (i = 0; i < keys.length; i++) {
        var list = byDiff[keys[i]];
        for (j = list.length - 1; j > 0; j--) { k = Math.floor(Math.random() * (j + 1)); var tmp = list[j]; list[j] = list[k]; list[k] = tmp; }
        queue = queue.concat(list);
      }
      var f = levels[0] && levels[0][0], at = f ? queue.indexOf(f) : -1;   // the very first level always opens a run

  }
  // Published rooms are fetched as plain data. If that fails, the last good copy is used, then the built-in set.
  // One published record is not a room: it holds the order of the levels on the map (set in the builder's Game map).
  var mapOrder = {};
  function useLive(list) {
    var ok = [], doc = null;
    for (var i = 0; i < (list || []).length; i++) { if (list[i] && list[i].kind === 'map') doc = list[i]; else if (usable(list[i])) ok.push(list[i]); }
    mapOrder = (doc && doc.order) || {};
    liveRooms = ok; queue = []; rebuildLevels();
    return ok.length + (doc ? 1 : 0);
  }
  function fetchLive() {
    if (!window.fetch) return;
    var head = { headers: { apikey: BACKEND.key } }, rows;
    fetch(BACKEND.url + '/rest/v1/rooms?select=id,name,difficulty,published_version_id&published_version_id=not.is.null', head)
      .then(function (r) { if (!r.ok) throw new Error('rooms ' + r.status); return r.json(); })
      .then(function (list) {
        rows = list;
        if (!rows.length) return [];
        var ids = rows.map(function (x) { return x.published_version_id; }).join(',');
        return fetch(BACKEND.url + '/rest/v1/room_versions?select=id,data&id=in.(' + ids + ')', head)
          .then(function (r) { if (!r.ok) throw new Error('versions ' + r.status); return r.json(); });
      })
      .then(function (vers) {
        var byId = {}, out = [], i;
        for (i = 0; i < vers.length; i++) byId[vers[i].id] = vers[i].data;
        for (i = 0; i < rows.length; i++) {
          var d = byId[rows[i].published_version_id];
          if (d) { d.id = rows[i].id; d.name = rows[i].name; d.difficulty = rows[i].difficulty; out.push(d); }
        }
        if (useLive(out)) { try { localStorage.setItem(LIVE_KEY, JSON.stringify(out)); } catch (e) {} }
        else { try { localStorage.removeItem(LIVE_KEY); } catch (e) {} }
      })
      .catch(function () {});
  }

  var room, T, cols, rows, grid, spawn, hazards, exits, refills, tileLayer;
  var crumbles = [], crumbleAt = {}, movers = [], tracks = [], backs = {}, flames = [], fireballs = [], springs = [], gems = [], roomKeys = [], doors = [], doorAt = {}, jets = [], drones = [], lava = null;
  var KIND = { '#': 1, 'I': 2, 'C': 3, 'D': 4 }; // 1 brick, 2 ice, 3 crumbling block, 4 locked door

  function buildRoom(data) {
    if (data.format !== 1) { throw new Error('Unsupported level format ' + data.format); }
    if (data.grid.cols * data.grid.tile !== LW || (data.grid.rows * data.grid.tile !== LH && data.grid.rows * data.grid.tile !== 2 * LH) || data.tiles.length !== data.grid.rows) {
      throw new Error('Room must be ' + LW + ' wide and one or two screens (' + LH + ' or ' + 2 * LH + ') tall');
    }
    var th = themeOf(data); setTileTheme(th); C.bg = th.bg; C.dot = th.dot;
    room = data; T = data.grid.tile; cols = data.grid.cols; rows = data.grid.rows;
    setRoomHeight(rows * T);
    grid = []; hazards = []; exits = []; refills = []; spawn = { x: T, y: T };
    crumbles = []; crumbleAt = {}; movers = []; tracks = []; backs = {}; flames = []; fireballs = []; springs = []; gems = []; roomKeys = []; doors = []; doorAt = {}; jets = []; drones = []; lava = null;
    for (var r = 0; r < rows; r++) {
      grid.push([]);
      for (var c = 0; c < cols; c++) {
        var ch = data.tiles[r].charAt(c), x = c * T, y = r * T;
        grid[r].push(KIND[ch] || 0);
        if (ch === 'C') { var cb = { c: c, r: r, x: x, y: y, state: 'idle', t: 0 }; crumbles.push(cb); crumbleAt[r * cols + c] = cb; }
        else if (ch === '-' || ch === '|') tracks.push({ x: x, y: y, v: ch === '|' });
        else if (ch === 'b') backs[r * cols + c] = 1;   // backdrop: scenery only
        if (ch === 'S') spawn = { x: x + 1, y: y };
        else if (ch === 'E') exits.push({ x: x, y: y, w: T, h: T });
        else if (ch === 'o') refills.push({ x: x + 1, y: y + 1, w: T - 2, h: T - 2, timer: 0 });
        else if (ch === '^') hazards.push({ x: x + 1, y: y + 6, w: T - 2, h: 4, dir: 0, tx: x, ty: y });
        else if (ch === 'v') hazards.push({ x: x + 1, y: y, w: T - 2, h: 4, dir: 2, tx: x, ty: y });
        else if (ch === '>') hazards.push({ x: x, y: y + 1, w: 4, h: T - 2, dir: 1, tx: x, ty: y });
        else if (ch === '<') hazards.push({ x: x + 6, y: y + 1, w: 4, h: T - 2, dir: 3, tx: x, ty: y });
        else if (ch === 'u') springs.push({ x: x, y: y, t: 0 });                                  // a spring: land on it to bounce high
        else if (ch === 'G') gems.push({ x: x, y: y, state: 'idle', fx: x, fy: y });                 // a gem: optional, carried to safe ground to keep
        else if (ch === 'k') roomKeys.push({ x: x, y: y, state: 'idle', fx: x, fy: y });                 // a key: follows you and opens the first door you touch
        else if (ch === 'D') { var dr = { c: c, r: r, x: x, y: y, open: false, t: 0, dirty: true }; doors.push(dr); doorAt[r * cols + c] = dr; }   // a locked door: solid until a key is brought to it
        else if (ch === 'F') { hazards.push({ x: x + 2, y: y + 4, w: 6, h: 6, dir: 4, tx: x, ty: y }); flames.push({ x: x, y: y }); }   // a flame on the ground
        else if (ch === 'J' || ch === 'L' || ch === '%') jets.push({ x: x, y: y, ph: (c * 0.55) % (P.jetOff + P.jetWarn + P.jetOn), on: false, warn: false, laser: ch === 'L', holo: ch === '%' });   // a fire jet (or a laser emitter in the Temple, a holo sign in Neon Row): fires a column on a cycle
        else if (ch === 'O') drones.push({ x: x, y: y, axis: '', min: 0, max: 0, dir: 1, wait: 0, rem: 0, fire: 0 });   // a patrol drone: rides a track, fires straight down at each stop
        else if (ch === '~') { if (!lava) lava = { y0: y, y: y }; else lava.y0 = lava.y = Math.min(lava.y0, y); }                  // lava: everything below the top lava tile, and it rises
      }
    }
    findMovers(data.tiles); findFireballs(data.tiles); findDrones(data.tiles);
    drawTileLayer();
  }

  // Moving platforms are painted as a run of '=' tiles. A line of '-' tiles beside it, or '|' tiles above or below it,
  // is the track it shuttles along. With no track it just stays put.
  // A zip mover ('z') is painted the same way but waits where it is until you stand on it, then shoots to the far end
  // of its track, rests, and crawls back to wait again.
  function findMovers(t) {
    function at(c, r) { return (r >= 0 && r < rows && c >= 0 && c < cols) ? t[r].charAt(c) : ''; }
    for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
      var ch = at(c, r);
      if ((ch !== '=' && ch !== 'z') || at(c - 1, r) === ch) continue;
      var c1 = c; while (at(c1 + 1, r) === ch) c1++;
      var m = { x: c * T, y: r * T, w: (c1 - c + 1) * T, h: T, axis: '', min: 0, max: 0, dir: 1, wait: 0, rem: 0, vx: 0, vy: 0, zip: ch === 'z', zs: 'idle' };
      var a = c, b = c1; while (at(a - 1, r) === '-') a--; while (at(b + 1, r) === '-') b++;
      if (a < c || b > c1) { m.axis = 'x'; m.min = a * T; m.max = (b + 1) * T - m.w; m.dir = (b - c1) >= (c - a) ? 1 : -1; }
      else {
        var top = r, bot = r;
        for (var k = c; k <= c1; k++) { var u = r, d = r; while (at(k, u - 1) === '|') u--; while (at(k, d + 1) === '|') d++; top = Math.min(top, u); bot = Math.max(bot, d); }
        if (top < r || bot > r) { m.axis = 'y'; m.min = top * T; m.max = bot * T; m.dir = (r - top) >= (bot - r) ? -1 : 1; }
      }
      m.x0 = m.x; m.y0 = m.y; m.dir0 = m.dir;
      movers.push(m);
    }
  }
  function resetDynamics() {
    var i;
    for (i = 0; i < crumbles.length; i++) { crumbles[i].state = 'idle'; crumbles[i].t = 0; crumbles[i].dirty = true; }
    for (i = 0; i < movers.length; i++) { var m = movers[i]; m.x = m.x0; m.y = m.y0; m.dir = m.dir0; m.wait = 0; m.rem = 0; m.vx = 0; m.vy = 0; m.zs = 'idle'; }
    for (i = 0; i < fireballs.length; i++) { var f = fireballs[i]; f.x = f.x0; f.y = f.y0; f.dir = f.dir0; f.wait = 0; f.rem = 0; }
    for (i = 0; i < drones.length; i++) { var dn = drones[i]; dn.x = dn.x0; dn.dir = dn.dir0; dn.wait = 0; dn.rem = 0; dn.fire = 0; }
    for (i = 0; i < springs.length; i++) springs[i].t = 0;
    for (i = 0; i < gems.length; i++) { gems[i].state = 'idle'; gems[i].fx = gems[i].x; gems[i].fy = gems[i].y; }
    for (i = 0; i < roomKeys.length; i++) { roomKeys[i].state = 'idle'; roomKeys[i].fx = roomKeys[i].x; roomKeys[i].fy = roomKeys[i].y; }
    for (i = 0; i < doors.length; i++) { doors[i].open = false; doors[i].t = 0; doors[i].dirty = true; }
    if (lava) { lava.y = lava.y0; lava.shown = -1; }
  }
  // Fire jets fire on a shared clock (offset per column) so the pattern is the same every attempt.
  function jetPhase(j) { var per = P.jetOff + P.jetWarn + P.jetOn, t = (run.time + j.ph) % per; return t < P.jetOff ? { on: false, warn: false, left: P.jetOff - t } : t < P.jetOff + P.jetWarn ? { on: false, warn: true, left: P.jetOff + P.jetWarn - t } : { on: true, warn: false, left: per - t }; }
  function jetRect(j) { return { x: j.x + 2, y: j.y - 2 * T + 2, w: 6, h: 3 * T - 3 }; }
  // A key touching a closed door opens that door and every door tile joined to it; the key is used up.
  function openDoor(dr) {
    var stack = [dr];
    while (stack.length) {
      var d = stack.pop(); if (d.open) continue;
      d.open = true; d.t = 0.3; d.dirty = true;
      var nb = [doorAt[(d.r - 1) * cols + d.c], doorAt[(d.r + 1) * cols + d.c], doorAt[d.r * cols + d.c - 1], doorAt[d.r * cols + d.c + 1]];

  }

  function solidTile(c, r) {
    if (c < 0 || c >= cols || r < 0) return true;
    if (r >= rows) return false;
    var k = grid[r][c];
    if (k === 3) return crumbleAt[r * cols + c].state !== 'gone';
    if (k === 4) return !doorAt[r * cols + c].open;
    return k > 0;
  }
  function kindAt(c, r) { return (c < 0 || c >= cols || r < 0 || r >= rows) ? 1 : (solidTile(c, r) ? grid[r][c] : 0); }
  function hitMover(x, y, w, h, skip) {
    for (var i = 0; i < movers.length; i++) { var m = movers[i]; if (m !== skip && x < m.x + m.w && x + w > m.x && y < m.y + m.h && y + h > m.y) return m; }

  }
  function hitTiles(x, y, w, h) {
    var c0 = Math.floor(x / T), c1 = Math.floor((x + w - 1) / T);
    var r0 = Math.floor(y / T), r1 = Math.floor((y + h - 1) / T);

    return false;

  // What the character is touching in a strip of cells: 'ice' only if every solid cell there is ice.

  function touchCrumble(x, y, w, h) {

    for (var r = r0; r <= r1; r++) for (var c = c0; c <= c1; c++) {

  function riding(m) {

    return pl.state === 'climb' && pl.y + pl.h > m.y && pl.y < m.y + m.h &&                                // holding its side

  // Fireballs are painted as single '*' tiles on a track, the same way platforms are: a line of '-' beside one, or '|'

  function findFireballs(t) {
    function at(c, r) { return (r >= 0 && r < rows && c >= 0 && c < cols) ? t[r].charAt(c) : ''; }
    for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
      if (at(c, r) !== '*' && at(c, r) !== 'w') continue;
      var f = { x: c * T, y: r * T, axis: '', min: 0, max: 0, dir: 1, wait: 0, rem: 0, spark: at(c, r) === 'w' };   // 'w' is the Neon Row spark on a cable
      var a = c, b = c, top = r, bot = r;
      while (at(a - 1, r) === '-') a--; while (at(b + 1, r) === '-') b++;
      while (at(c, top - 1) === '|') top--; while (at(c, bot + 1) === '|') bot++;
      if (a < c || b > c) { f.axis = 'x'; f.min = a * T; f.max = b * T; f.dir = (b - c) >= (c - a) ? 1 : -1; }
      else if (top < r || bot > r) { f.axis = 'y'; f.min = top * T; f.max = bot * T; f.dir = (bot - r) >= (r - top) ? 1 : -1; }
      f.x0 = f.x; f.y0 = f.y; f.dir0 = f.dir;
      fireballs.push(f);
    }
  }
  function findDrones(t) {
    function at(c, r) { return (r >= 0 && r < rows && c >= 0 && c < cols) ? t[r].charAt(c) : ''; }
    for (var i = 0; i < drones.length; i++) {
      var f = drones[i], c = f.x / T, r = f.y / T, a = c, b = c;
      while (at(a - 1, r) === '-') a--; while (at(b + 1, r) === '-') b++;
      if (a < c || b > c) { f.axis = 'x'; f.min = a * T; f.max = b * T; f.dir = (b - c) >= (c - a) ? 1 : -1; }
      f.x0 = f.x; f.dir0 = f.dir;
    }
  }
  function stepDrones(dt) {
    for (var i = 0; i < drones.length; i++) {
      var f = drones[i];
      if (f.fire > 0) { f.fire -= dt; continue; }
      if (f.wait > 0) { f.wait -= dt; if (f.wait <= 0 && f.x === f.x0) f.fire = P.droneFire; continue; }   // at its home end: pause, then a burst downward; the far end is just a pause
      if (!f.axis || f.min === f.max) continue;
      f.rem += P.droneSpeed * dt;

        else { box(q.x - 7, q.y - 3, 14, 12, '#3a4675'); box(q.x - 5, q.y - 10, 10, 3, '#3a4675'); box(q.x - 5, q.y - 10, 3, 8, '#3a4675'); box(q.x + 2, q.y - 10, 3, 8, '#3a4675'); }
        box(q.x - 23, q.y + 23, 46, 14, th.bg);
        var nk = hasGem(list[i]) ? 4 : 3;
        for (var k = 0; k < nk; k++) star(h, u, q.x - (nk - 1) * 6 + k * 12, q.y + 30, nk === 4 ? 4.8 : 5.5, pr && k < pr.stars ? C.flame : '#232c55');
        hits.push({ x: x0 - 4, y: y0 - 4, w: 60, h: 62, fn: (function (n) { return function () { if (sel.i === n) startLevel(sel.w, n); else { sel.i = n; lastSig = ''; } }; })(i) });
      }
      var cur = list[sel.i], cp = cur && prog[cur.id];
      box(0, 430, LW, 50, 'rgba(10,13,28,0.6)');
      if (!list.length) t('No levels here yet', 135, 250, 9, C.dim, 'center');
      else if (!open) t('Finish World ' + WORLDS[w - 1].id + ' to open this one', 135, 448, 8, C.text, 'center');
      else if (!levelOpen(w, sel.i)) t('Beat ' + wd.id + '-' + sel.i + ' first', 135, 448, 8, C.text, 'center');
      else {
        t((cur.name || '').toUpperCase().substring(0, 22), 135, 444, 9, C.text, 'center');
        t((cp ? 'BEST ' + secs(cp.time) + '   ' : '') + 'PAR ' + secs(parOf(cur)), 135, 456, 7, C.dim, 'center');
      }
      t(usedPad ? 'Jump: play   Dash: menu' : 'Arrows move   C plays   X or Esc: menu   or click', 135, 472, 6.5, C.dim, 'center');
    }
    if (check === 1) t(fps.secs < 2 ? 'measuring' : fps.now + ' fps', 135, 10, 7, C.flame, 'center');
    if (wiz.on) drawWiz(u);
  }

  // Screen check: shows what the display is doing, marks the picture's edges, and can lay the tile grid on top.
  function drawCheck(u, t) {
    var i, px = Math.max(1, Math.round(u));
    if (check === 3) {
      for (i = 1; i < cols; i++) { h.fillStyle = i % 5 === 0 ? 'rgba(255,183,74,0.55)' : 'rgba(255,255,255,0.14)'; h.fillRect(Math.round(i * T * u), 0, 1, hud.height); }
      for (i = 1; i < rows; i++) { h.fillStyle = i % 5 === 0 ? 'rgba(255,183,74,0.55)' : 'rgba(255,255,255,0.14)'; h.fillRect(0, Math.round(i * T * u), hud.width, 1); }
    }
    h.fillStyle = C.flame;
    h.fillRect(0, 0, hud.width, px); h.fillRect(0, hud.height - px, hud.width, px);
    h.fillRect(0, 0, px, hud.height); h.fillRect(hud.width - px, 0, px, hud.height);
    var L = 12 * u, w = 3 * u;
    h.fillRect(0, 0, L, w); h.fillRect(0, 0, w, L);
    h.fillRect(hud.width - L, 0, L, w); h.fillRect(hud.width - w, 0, w, L);
    h.fillRect(0, hud.height - w, L, w); h.fillRect(0, hud.height - L, w, L);
    h.fillRect(hud.width - L, hud.height - w, L, w); h.fillRect(hud.width - w, hud.height - L, w, L);
    h.fillStyle = 'rgba(11,16,32,0.88)'; h.fillRect(6 * u, 14 * u, 216 * u, 66 * u);
    t('SCREEN CHECK' + (check === 3 ? '  grid ' + cols + ' x ' + rows : ''), 10, 23, 6, C.flame);
    t('Window ' + view.physW + ' x ' + view.physH + ' px', 10, 33, 7, C.text);
    t('Scale ' + (view.whole ? view.scale + 'x' : view.scale.toFixed(2) + 'x') + ', pixels square: ' + (view.whole ? 'yes' : 'no'), 10, 43, 7, C.text);
    t(fps.secs < 2 ? 'Measuring speed' : fps.now + ' fps now, lowest ' + fps.low, 10, 53, 7, C.text);
    t('Controller: ' + padInfo, 10, 63, 7, C.text);
    t('Next clicks: grid, then controller setup', 10, 73, 6, C.dim);
  }

  // ---- main loop: fixed 60 steps a second so it plays the same on any refresh rate ----
  var last = 0, acc = 0, manual = false;
  function frame(now) {
    var t0 = performance.now();
    if (!manual) {
      var dt = last ? (now - last) / 1000 : STEP;
      last = now;
      acc += Math.min(dt, 0.1);
      fps.frames++; fps.acc += dt;
      if (fps.acc >= 1) {
        fps.now = Math.round(fps.frames / fps.acc); fps.secs++; fps.ms = Math.round(fps.work / fps.frames * 10) / 10; fps.work = 0;
        if (fps.secs === 2 || (fps.secs > 2 && fps.now < fps.low)) fps.low = fps.now;
        fps.frames = 0; fps.acc = 0;
      }
      var inp = readInput();
      if (wiz.on) { wizTick(); acc = 0; render(); window.requestAnimationFrame(frame); return; }
      var any = inp.x || inp.y || inp.jump || inp.dash || inp.grab || inp.back;
      if (scene !== 'play') {                      // menu or map: nothing moves, so nothing is redrawn until you press something
        if (any) demo.idle = 0;
        else { demo.idle += Math.min(dt, 0.1); if (demo.idle >= DEMO_IDLE || location.hash === '#demo') startDemo(); }
        if (scene === 'settings') settingsTick(inp); else if (scene !== 'play') screenInput(inp);
        acc = 0;
      } else if (demo.on && any) { demo.on = false; toMenu(); navPrev = inp; acc = 0; }
      else {
        if (inp.back && !navPrev.back && !testMode && !demo.on && !embedded) { leavePlay(); acc = 0; }
        navPrev = inp;
        while (scene === 'play' && acc >= STEP) { step(demo.on ? demoInput() : inp); acc -= STEP; }
      }
    }
    render();
    fps.work += performance.now() - t0;
    window.requestAnimationFrame(frame);
  }

  try { useLive(JSON.parse(localStorage.getItem(LIVE_KEY))); } catch (e) {}
  rebuildLevels();
  resetRun();
  if (!embedded) { fetchLive(); scene = 'menu'; }

  // The room builder runs this same game in a frame and hands it the room being edited.
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'climber-room') return;
    try { buildRoom(d.room); } catch (err) { window.parent.postMessage({ type: 'climber-error', message: String(err.message) }, '*'); return; }
    testMode = true; scene = 'play'; demo.on = false; demo.idle = 0; resetRun(); lastSig = ''; window.focus();
  });
  if (embedded) window.parent.postMessage({ type: 'climber-ready' }, '*');
  setWeather(weather.on);
  layout();
  window.requestAnimationFrame(frame);

  // Hook for the level builder's validator and for automated checks.
  window.__climber = {
    manual: function (on) { manual = on; },
    step: function (inp, n) { for (var i = 0; i < (n || 1); i++) step(inp); return this.state(); },
    state: function () {
      return { x: pl.x, y: pl.y, vx: Math.round(pl.vx), vy: Math.round(pl.vy), state: pl.state, ground: pl.onGround,
               dashes: pl.dashes, stamina: Math.round(pl.stamina), dead: pl.dead, deaths: run.deaths, won: run.won,
               movers: movers.map(function (m) { return { x: m.x, y: m.y, wait: m.wait, z: m.zip ? m.zs : '' }; }),
               fireballs: fireballs.map(function (f) { return { x: f.x, y: f.y, dir: f.dir, wait: f.wait }; }), gem: gotGem(), cam: cam.y,
               keys: roomKeys.map(function (k) { return k.state; }), doors: doors.map(function (d) { return d.open; }),
               jets: jets.map(function (j) { var p = jetPhase(j); return { x: j.x, y: j.y, on: p.on, warn: p.warn, left: p.left }; }), lava: lava ? lava.y : null,
               drones: drones.map(function (d) { return { x: d.x, y: d.y, dir: d.dir, wait: d.wait, fire: d.fire }; }) };
    },
    reset: function () { scene = 'play'; mode = 'endless'; resetRun(); }, kill: die,
    view: function () { return { scene: scene, mode: mode, sel: sel, lvl: lvl, room: room.name, prog: prog, levels: levels.map(function (l) { return l.map(function (r) { return r.name; }); }), result: run.result, time: run.time }; },
    weather: function (on) { setWeather(on); return weather.on; },
    city: function (on) { if (on === 'ship') { if (city) city.nextShip = tick; } else if (on !== undefined) setCity(on); return { on: cityOn, live: !!city, movers: city ? city.movers.map(function (m) { return { kind: m.kind, x: Math.round(m.x), y: m.y }; }) : [], stats: city ? city.stats : null, lanes: city ? city.lanes.map(function (l) { return l.depth.charAt(1) + l.y; }) : [], chunks: chunkCopies, tick: tick }; },
    nav: function (o) { screenInput(Object.assign({ x: 0, y: 0, jump: false, dash: false, grab: false, back: false }, o)); screenInput({ x: 0, y: 0, jump: false, dash: false, grab: false, back: false }); return this.view(); },
    startLevel: startLevel,
    demoAll: function () { // plays every recorded demo to the end, to prove the recordings still reach the exit
      var out = {}, i, n;
      for (i = 0; i < starters.length; i++) {
        demo.room = starters[i]; demo.rec = i ? DEMOS[starters[i].id] : null; if (i && !demo.rec) { out[starters[i].name] = 'no recording'; continue; }
        demo.rk = 0; demo.rleft = demo.rec ? demo.rec[1] : 0;
        scene = 'play'; demo.on = true; demo.stage = 1; demo.f = 0; demo.t0 = 0; demo.back = false; demo.winT = 0; resetRun();
        for (n = 0; n < 4000 && !run.won && !pl.dead; n++) step(demoInput());
        out[starters[i].name] = run.won ? 'won ' + n : (pl.dead ? 'died ' + n : 'ran out ' + n);
      }
      demo.on = false; return out;
    },
    levelProbe: function () { // plays level 1-1 from the map with the demo's inputs, to prove scoring and saving
      startLevel(0, 0); demo.rec = null; demo.stage = 1; demo.f = 0; demo.t0 = 0; demo.back = false;
      var n = 0; while (!run.won && n < 3000) { step(demoInput()); n++; }
      return this.view();
    },
    demoStart: function () { startDemo(); }, demoStep: function (n) { for (var i = 0; i < n; i++) step(demoInput()); return this.state(); },
    chainProbe: function () { // plays room one as a normal run with the demo's inputs, to prove the exit leads to room two
      scene = 'play'; mode = 'endless';
      demo.rec = null; demo.stage = 1; demo.f = 0; demo.t0 = 0; demo.back = false;
      var n = 0, none = { x: 0, y: 0, jump: false, dash: false, grab: false };
      while (run.count === 1 && n < 3000) { step(demoInput()); n++; }
      for (var i = 0; i < 40; i++) step(none);
      return { steps: n, count: run.count, room: room.name, falls: run.deaths, x: pl.x, y: pl.y, pool: pool.length };
    }, load: function (data) { testMode = true; scene = 'play'; buildRoom(data); resetRun(); },
    demoRun: function (n) { startDemo(); demo.room = starters[0]; demo.rec = null; resetRun(); for (var i = 0; i < n && !run.won; i++) step(demoInput()); return { steps: i, won: run.won, deaths: run.deaths, stage: demo.stage }; }
  };
})();
</script>
