<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Climber Slice</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; background: #0a0d1c; }
  #stage canvas { position: absolute; display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<div id="stage"></div>

<!-- Built-in starter rooms (level format v1). The game only ever reads rooms as data through loadRoom(). -->
<script type="application/json" id="starter-rooms">[/*ROOM_JSON*/]</script>

<script>
(function () {
  'use strict';

  var LW = 270, LH = 480, STEP = 1 / 60;
  var K = 1.25; // tiles are 10px, so classic 8px-tile platformer speeds are scaled up by 10/8

  // ---- movement tuning (px and seconds) ----
  var P = {
    maxRun: 90 * K, runAccel: 1000 * K, runReduce: 400 * K, airMult: 0.65,
    gravity: 900 * K, maxFall: 160 * K, wallSlideMax: 40 * K, halfGravBelow: 40 * K,
    jumpSpeed: -105 * K, jumpHBoost: 40 * K, varJumpTime: 0.2,
    coyote: 0.1, jumpBuffer: 0.1, dashBuffer: 0.08,
    dashSpeed: 240 * K, endDashSpeed: 160 * K, dashTime: 0.15, dashCooldown: 0.2, dashFreeze: 0.05,
    wallJumpH: 130 * K, wallJumpForce: 0.16, wallCheck: 3,
    climbUp: -45 * K, climbDown: 80 * K, climbAccel: 900 * K, climbHop: -120 * K,
    stamina: 110, dashCost: 60, climbUpCost: 45.45, climbStillCost: 10, climbJumpCost: 27.5, tiredBelow: 20,
    cornerCorrect: 4, iceGrip: 0.1, crumbleDelay: 0.5, crumbleRespawn: 2.5, moverSpeed: 45, moverWait: 0.4, exitTime: 0.35, dieTime: 0.28, hurtTime: 0.06, spawnTime: 0.3, refillRespawn: 2.5
  };

  var C = {
    bg: '#0a0d1c', dot: '#1b2145', solid: '#36416e', cap: '#93a4de', under: '#262f55',
    spike: '#e9edf7', body: '#ffe9b8', tired: '#c7a58c', eye: '#0a0d1c',
    flame: '#ffb74a', flameOut: '#56608a', hurt: '#ff8f7d', smoke: '#8d9ac0', teal: '#5fd6b3', tealDim: '#2b6f66',
    text: '#eef1fa', dim: '#9aa6cc'
  };

/*SHARED_TILES*/

/*SHARED_HERO*/

/*SHARED_WORLDS*/

  // ---- level loading: rooms are data, never hard-coded ----
/*SHARED_CONFIG*/
  var LIVE_KEY = 'climber.live.v1';
  var starters = JSON.parse(document.getElementById('starter-rooms').textContent); // built-in set, also the offline fallback
  var pool = starters, queue = [];
  // Worlds and levels. Built-in rooms fill each world until numbered levels are published for it.
  var PROG_KEY = 'climber.progress.v1', prog = {}, levels = [], liveRooms = [], dataVer = 0, unlockAll = location.hash === '#unlock';
  try { prog = JSON.parse(localStorage.getItem(PROG_KEY)) || {}; } catch (e) {}
  function rebuildLevels() {
    levels = WORLDS.map(function (wd, w) {
      var built = [], pub = [], loose = [], i, r;
      for (i = 0; i < starters.length; i++) if (worldOf(starters[i]) === w + 1) built.push(starters[i]);
      for (i = 0; i < liveRooms.length; i++) { r = liveRooms[i]; if (worldOf(r) === w + 1) (r.level > 0 ? pub : loose).push(r); }
      var byLevel = function (a, b) { return (a.level | 0) - (b.level | 0); };
      return (pub.length ? pub.sort(byLevel) : built.sort(byLevel)).concat(loose);
    });
    dataVer++;
  }
  function beaten(r) { return !!prog[r.id]; }
  function worldOpen(w) {
    if (unlockAll || w <= 0) return true;
    for (var i = 0; i < levels[w - 1].length; i++) if (!beaten(levels[w - 1][i])) return false;
    return worldOpen(w - 1);
  }
  function levelOpen(w, i) { return worldOpen(w) && (unlockAll || i === 0 || beaten(levels[w][i - 1])); }
  function endlessPool() {
    var out = [];
    for (var w = 0; w < levels.length; w++) if (worldOpen(w)) out = out.concat(levels[w]);
    return out.length ? out : starters;
  }
  function usable(d) {
    return d && d.format === 1 && d.grid && d.grid.cols * d.grid.tile === LW && d.grid.rows * d.grid.tile === LH && d.tiles && d.tiles.length === d.grid.rows;
  }
  // The endless run: easier rooms first, shuffled inside each difficulty, then round again.
  function nextFromQueue() {
    if (!queue.length) {
      pool = endlessPool();
      var byDiff = {}, keys = [], i, j, k;
      for (i = 0; i < pool.length; i++) { k = pool[i].difficulty || 1; if (!byDiff[k]) { byDiff[k] = []; keys.push(k); } byDiff[k].push(pool[i]); }
      keys.sort(function (a, b) { return a - b; });
      for (i = 0; i < keys.length; i++) {
        var list = byDiff[keys[i]];
        for (j = list.length - 1; j > 0; j--) { k = Math.floor(Math.random() * (j + 1)); var tmp = list[j]; list[j] = list[k]; list[k] = tmp; }
        queue = queue.concat(list);
      }
      var f = levels[0] && levels[0][0], at = f ? queue.indexOf(f) : -1;   // the very first level always opens a run
      if (at > 0) { queue.splice(at, 1); queue.unshift(f); }
    }
    return queue.shift();
  }
  // Published rooms are fetched as plain data. If that fails, the last good copy is used, then the built-in set.
  function useLive(list) {
    var ok = [];
    for (var i = 0; i < (list || []).length; i++) if (usable(list[i])) ok.push(list[i]);
    liveRooms = ok; queue = []; rebuildLevels();
    return ok.length;
  }
  function fetchLive() {
    if (!window.fetch) return;
    var head = { headers: { apikey: BACKEND.key } }, rows;
    fetch(BACKEND.url + '/rest/v1/rooms?select=id,name,difficulty,published_version_id&published_version_id=not.is.null', head)
      .then(function (r) { if (!r.ok) throw new Error('rooms ' + r.status); return r.json(); })
      .then(function (list) {
        rows = list;
        if (!rows.length) return [];
        var ids = rows.map(function (x) { return x.published_version_id; }).join(',');
        return fetch(BACKEND.url + '/rest/v1/room_versions?select=id,data&id=in.(' + ids + ')', head)
          .then(function (r) { if (!r.ok) throw new Error('versions ' + r.status); return r.json(); });
      })
      .then(function (vers) {
        var byId = {}, out = [], i;
        for (i = 0; i < vers.length; i++) byId[vers[i].id] = vers[i].data;
        for (i = 0; i < rows.length; i++) {
          var d = byId[rows[i].published_version_id];
          if (d) { d.id = rows[i].id; d.name = rows[i].name; d.difficulty = rows[i].difficulty; out.push(d); }
        }
        if (useLive(out)) { try { localStorage.setItem(LIVE_KEY, JSON.stringify(out)); } catch (e) {} }
        else { try { localStorage.removeItem(LIVE_KEY); } catch (e) {} }
      })
      .catch(function () {});
  }

  var room, T, cols, rows, grid, spawn, hazards, exits, refills, tileLayer;
  var crumbles = [], crumbleAt = {}, movers = [], tracks = [], backs = {};
  var KIND = { '#': 1, 'I': 2, 'C': 3 }; // 1 brick, 2 ice, 3 crumbling block

  function buildRoom(data) {
    if (data.format !== 1) { throw new Error('Unsupported level format ' + data.format); }
    if (data.grid.cols * data.grid.tile !== LW || data.grid.rows * data.grid.tile !== LH || data.tiles.length !== data.grid.rows) {
      throw new Error('Room must fill ' + LW + ' by ' + LH + ' pixels');
    }
    var th = themeOf(data); setTileTheme(th); C.bg = th.bg; C.dot = th.dot;
    room = data; T = data.grid.tile; cols = data.grid.cols; rows = data.grid.rows;
    grid = []; hazards = []; exits = []; refills = []; spawn = { x: T, y: T };
    crumbles = []; crumbleAt = {}; movers = []; tracks = []; backs = {};
    for (var r = 0; r < rows; r++) {
      grid.push([]);
      for (var c = 0; c < cols; c++) {
        var ch = data.tiles[r].charAt(c), x = c * T, y = r * T;
        grid[r].push(KIND[ch] || 0);
        if (ch === 'C') { var cb = { c: c, r: r, x: x, y: y, state: 'idle', t: 0 }; crumbles.push(cb); crumbleAt[r * cols + c] = cb; }
        else if (ch === '-' || ch === '|') tracks.push({ x: x, y: y, v: ch === '|' });
        else if (ch === 'b') backs[r * cols + c] = 1;   // backdrop: scenery only
        if (ch === 'S') spawn = { x: x + 1, y: y };
        else if (ch === 'E') exits.push({ x: x, y: y, w: T, h: T });
        else if (ch === 'o') refills.push({ x: x + 1, y: y + 1, w: T - 2, h: T - 2, timer: 0 });
        else if (ch === '^') hazards.push({ x: x + 1, y: y + 6, w: T - 2, h: 4, dir: 0, tx: x, ty: y });
        else if (ch === 'v') hazards.push({ x: x + 1, y: y, w: T - 2, h: 4, dir: 2, tx: x, ty: y });
        else if (ch === '>') hazards.push({ x: x, y: y + 1, w: 4, h: T - 2, dir: 1, tx: x, ty: y });
        else if (ch === '<') hazards.push({ x: x + 6, y: y + 1, w: 4, h: T - 2, dir: 3, tx: x, ty: y });
      }
    }
    findMovers(data.tiles);
    drawTileLayer();
  }

  // Moving platforms are painted as a run of '=' tiles. A line of '-' tiles beside it, or '|' tiles above or below it,
  // is the track it shuttles along. With no track it just stays put.
  function findMovers(t) {
    function at(c, r) { return (r >= 0 && r < rows && c >= 0 && c < cols) ? t[r].charAt(c) : ''; }
    for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
      if (at(c, r) !== '=' || at(c - 1, r) === '=') continue;
      var c1 = c; while (at(c1 + 1, r) === '=') c1++;
      var m = { x: c * T, y: r * T, w: (c1 - c + 1) * T, h: T, axis: '', min: 0, max: 0, dir: 1, wait: 0, rem: 0, vx: 0, vy: 0 };
      var a = c, b = c1; while (at(a - 1, r) === '-') a--; while (at(b + 1, r) === '-') b++;
      if (a < c || b > c1) { m.axis = 'x'; m.min = a * T; m.max = (b + 1) * T - m.w; m.dir = (b - c1) >= (c - a) ? 1 : -1; }
      else {
        var top = r, bot = r;
        for (var k = c; k <= c1; k++) { var u = r, d = r; while (at(k, u - 1) === '|') u--; while (at(k, d + 1) === '|') d++; top = Math.min(top, u); bot = Math.max(bot, d); }
        if (top < r || bot > r) { m.axis = 'y'; m.min = top * T; m.max = bot * T; m.dir = (r - top) >= (bot - r) ? -1 : 1; }
      }
      m.x0 = m.x; m.y0 = m.y; m.dir0 = m.dir;
      movers.push(m);
    }
  }
  function resetDynamics() {
    var i;
    for (i = 0; i < crumbles.length; i++) { crumbles[i].state = 'idle'; crumbles[i].t = 0; crumbles[i].dirty = true; }
    for (i = 0; i < movers.length; i++) { var m = movers[i]; m.x = m.x0; m.y = m.y0; m.dir = m.dir0; m.wait = 0; m.rem = 0; m.vx = 0; m.vy = 0; }
  }

  function solidTile(c, r) {
    if (c < 0 || c >= cols || r < 0) return true;
    if (r >= rows) return false;
    var k = grid[r][c];
    if (k === 3) return crumbleAt[r * cols + c].state !== 'gone';
    return k > 0;
  }
  function kindAt(c, r) { return (c < 0 || c >= cols || r < 0 || r >= rows) ? 1 : (solidTile(c, r) ? grid[r][c] : 0); }
  function hitMover(x, y, w, h, skip) {
    for (var i = 0; i < movers.length; i++) { var m = movers[i]; if (m !== skip && x < m.x + m.w && x + w > m.x && y < m.y + m.h && y + h > m.y) return m; }
    return null;
  }
  function hitTiles(x, y, w, h) {
    var c0 = Math.floor(x / T), c1 = Math.floor((x + w - 1) / T);
    var r0 = Math.floor(y / T), r1 = Math.floor((y + h - 1) / T);
    for (var r = r0; r <= r1; r++) for (var c = c0; c <= c1; c++) if (solidTile(c, r)) return true;
    return false;
  }
  // What the character is touching in a strip of cells: 'ice' only if every solid cell there is ice.
  function surface(x, y, w, h) {
    var c0 = Math.floor(x / T), c1 = Math.floor((x + w - 1) / T), r0 = Math.floor(y / T), r1 = Math.floor((y + h - 1) / T), any = false, allIce = true;
    for (var r = r0; r <= r1; r++) for (var c = c0; c <= c1; c++) { var k = kindAt(c, r); if (k) { any = true; if (k !== 2) allIce = false; } }
    if (hitMover(x, y, w, h)) { any = true; allIce = false; }
    return any ? (allIce ? 'ice' : 'solid') : '';
  }
  function touchCrumble(x, y, w, h) {
    var c0 = Math.floor(x / T), c1 = Math.floor((x + w - 1) / T), r0 = Math.floor(y / T), r1 = Math.floor((y + h - 1) / T);
    for (var r = r0; r <= r1; r++) for (var c = c0; c <= c1; c++) {
      var cb = (r >= 0 && r < rows && c >= 0 && c < cols) ? crumbleAt[r * cols + c] : null;
      if (cb && cb.state === 'idle') { cb.state = 'shake'; cb.t = 0; }
    }
  }
  function riding(m) {
    if (pl.dead) return false;
    if (pl.vy >= 0 && pl.y + pl.h === m.y && pl.x + pl.w > m.x && pl.x < m.x + m.w) return true;        // standing on it
    return pl.state === 'climb' && pl.y + pl.h > m.y && pl.y < m.y + m.h &&                                // holding its side
      (pl.climbDir > 0 ? pl.x + pl.w === m.x : pl.x === m.x + m.w);
  }
  // Platforms move one pixel at a time. Anything riding is carried, anything in the way is pushed, and being
  // pushed into a wall is fatal.
  function stepMovers(dt) {
    for (var i = 0; i < movers.length; i++) {
      var m = movers[i];
      m.vx = 0; m.vy = 0;
      if (!m.axis || m.min === m.max) continue;
      if (m.wait > 0) { m.wait -= dt; continue; }
      m.rem += P.moverSpeed * dt;
      var n = Math.floor(m.rem); m.rem -= n;
      if (m.axis === 'x') m.vx = m.dir * P.moverSpeed; else m.vy = m.dir * P.moverSpeed;
      while (n-- > 0) {
        var pos = m.axis === 'x' ? m.x : m.y;
        if ((m.dir > 0 && pos >= m.max) || (m.dir < 0 && pos <= m.min)) { m.dir = -m.dir; m.wait = P.moverWait; m.rem = 0; break; }
        var dx = m.axis === 'x' ? m.dir : 0, dy = m.axis === 'y' ? m.dir : 0, carry = riding(m);
        m.x += dx; m.y += dy;
        if (pl.dead || fx.mode !== 'none') continue;
        var pushed = pl.x < m.x + m.w && pl.x + pl.w > m.x && pl.y < m.y + m.h && pl.y + pl.h > m.y;
        if (pushed || carry) {
          var free = !hitTiles(pl.x + dx, pl.y + dy, pl.w, pl.h) && !hitMover(pl.x + dx, pl.y + dy, pl.w, pl.h, m);
          if (free) { pl.x += dx; pl.y += dy; }
          else if (pushed) { die(); }
        }
      }
    }
  }
  function stepCrumbles(dt) {
    for (var i = 0; i < crumbles.length; i++) {
      var cb = crumbles[i];
      if (cb.state === 'idle') continue;
      cb.t += dt; cb.dirty = true;
      if (cb.state === 'shake' && cb.t >= P.crumbleDelay) { cb.state = 'gone'; cb.t = 0; }
      else if (cb.state === 'gone' && cb.t >= P.crumbleRespawn && !(pl.x < cb.x + T && pl.x + pl.w > cb.x && pl.y < cb.y + T && pl.y + pl.h > cb.y)) { cb.state = 'idle'; cb.t = 0; }
    }
  }
  function collide(x, y, w, h) { return hitTiles(x, y, w, h) || !!hitMover(x, y, w, h); }
  function overlap(a, x, y, w, h) { return x < a.x + a.w && x + w > a.x && y < a.y + a.h && y + h > a.y; }
  function approach(v, target, amount) { return v < target ? Math.min(v + amount, target) : Math.max(v - amount, target); }

  // ---- player ----
  var pl, run, fx = { mode: 'none', t: 0, x: 0, y: 0, facing: 1 };
  function resetPlayer() {
    pl = {
      x: spawn.x, y: spawn.y, w: 8, h: 10, rx: 0, ry: 0, vx: 0, vy: 0, facing: 1,
      state: 'normal', onGround: false, coyote: 0, jumpBuf: 0, dashBuf: 0,
      varJumpTimer: 0, varJumpSpeed: 0, dashes: 1, dashTimer: 0, dashCooldown: 0, dashDirX: 0, dashDirY: 0,
      freeze: 0, forceMove: 0, forceDir: 0, climbDir: 0, stamina: P.stamina,
      dead: false, prevJump: false, prevDash: false, trail: [], trailTick: 0
    };
    for (var i = 0; i < refills.length; i++) refills[i].timer = 0;
  }
  // scene: 'menu', 'map' or 'play'. mode: how rooms follow each other while playing, 'map' (one chosen level) or 'endless'.
  var scene = 'play', mode = 'endless', sel = { menu: 0, w: 0, i: 0 }, lvl = { w: 0, i: 0 };
  function staged() { return mode === 'map' && !testMode && !demo.on; }
  function startSpawn() { if (run && staged()) run.time = 0; resetPlayer(); resetDynamics(); fx = { mode: 'spawn', t: 0, x: pl.x, y: pl.y, facing: 1 }; }
  // A fresh run. In a builder test it replays the room being edited; in the demo it plays the first built-in room.
  function resetRun() {
    run = { deaths: 0, time: 0, won: false, count: 1, result: null };
    if (!testMode) {
      if (demo.on) buildRoom(demo.room || starters[0]);
      else if (mode === 'map' && levels[lvl.w] && levels[lvl.w][lvl.i]) buildRoom(levels[lvl.w][lvl.i]);
      else { queue = []; buildRoom(nextFromQueue()); }
    }
    startSpawn();
  }
  function nextRoom() { if (staged()) { finishLevel(); return; } run.count++; buildRoom(nextFromQueue()); startSpawn(); }
  // A level on the map is scored when you reach the exit: a star for beating it, one for few falls, one for par time.
  // The clock is the winning attempt only (it restarts on each respawn); falls count since you entered the level.
  function finishLevel() {
    var par = parOf(room), stars = 1 + (run.deaths <= STAR_FALLS ? 1 : 0) + (run.time <= par ? 1 : 0), old = prog[room.id];
    prog[room.id] = { stars: Math.max(stars, old ? old.stars : 0), time: old ? Math.min(old.time, run.time) : run.time, falls: old ? Math.min(old.falls, run.deaths) : run.deaths };
    try { localStorage.setItem(PROG_KEY, JSON.stringify(prog)); } catch (e) {}
    dataVer++;
    run.won = true; run.result = { stars: stars, par: par, next: lvl.i + 1 < levels[lvl.w].length, pick: 0, py: 0 };
  }
  function toMenu() { scene = 'menu'; demo.idle = 0; lastSig = ''; }
  function toMap() {
    scene = 'map'; mode = 'map'; demo.idle = 0; lastSig = '';
    if (sel.w >= levels.length) sel.w = 0;
    sel.i = Math.max(0, Math.min(sel.i, levels[sel.w].length - 1));
  }
  function firstOpen(w) { var n = levels[w].length, i; for (i = 0; i < n; i++) if (!beaten(levels[w][i])) return i; return Math.max(0, n - 1); }
  function startLevel(w, i) {
    if (!levels[w] || !levels[w][i] || !levelOpen(w, i)) return;
    mode = 'map'; scene = 'play'; lvl = { w: w, i: i }; sel.w = w; sel.i = i;
    resetRun(); pl.prevJump = pl.prevDash = true; allDirty = true; lastSig = '';
  }
  function startEndless() { mode = 'endless'; scene = 'play'; resetRun(); pl.prevJump = pl.prevDash = true; allDirty = true; lastSig = ''; }
  function clearButtons() {
    var list = [['RETRY', function () { startLevel(lvl.w, lvl.i); }], ['MAP', function () { afterLevel(false); }]];
    if (run.result && run.result.next) list.unshift(['NEXT LEVEL', function () { afterLevel(true); }]);
    return list;
  }
  function leavePlay() { if (run.won && run.result && staged()) { afterLevel(false); return; } if (mode === 'map') { sel.w = lvl.w; sel.i = lvl.i; toMap(); } else toMenu(); }
  function afterLevel(goOn) {
    var w = lvl.w, i = lvl.i;
    if (goOn && i + 1 < levels[w].length) { startLevel(w, i + 1); return; }
    if (i + 1 < levels[w].length) { sel.w = w; sel.i = i + 1; }
    else if (w + 1 < levels.length && levels[w + 1].length && worldOpen(w + 1)) { sel.w = w + 1; sel.i = firstOpen(w + 1); }
    else { sel.w = w; sel.i = i; }
    toMap();
  }

  function hit(x, y) { return collide(x, y, pl.w, pl.h); }
  function touching(dir, dist) { return hit(pl.x + dir * dist, pl.y); }

  // Screen shake: a short, small nudge of the whole picture on impacts. It moves the finished picture rather than
  // redrawing it, so it costs the frame nothing extra. size is in game pixels, time in seconds.
  var shake = { t: 0, size: 0, n: 0, last: '', pull: 0, len: 0 };
  function addShake(size, time, pull) { if (size >= shake.size || shake.t <= 0) { shake.size = size; shake.t = shake.len = time; shake.pull = pull || 0; } }
  function moveX(amount) {
    pl.rx += amount;
    var move = Math.round(pl.rx);
    if (!move) return;
    pl.rx -= move;
    var s = move > 0 ? 1 : -1;
    while (move) {
      if (!hit(pl.x + s, pl.y)) { pl.x += s; move -= s; continue; }
      var fixed = false;
      if (pl.state === 'dash' && pl.dashDirY === 0) {
        for (var i = 1; i <= P.cornerCorrect && !fixed; i++) {
          if (!hit(pl.x + s, pl.y - i)) { pl.y -= i; fixed = true; }
          else if (!hit(pl.x + s, pl.y + i)) { pl.y += i; fixed = true; }
        }
      }
      if (!fixed) { if (pl.state === 'dash') addShake(2, 0.14); pl.vx = 0; pl.rx = 0; return; }   // a dash slamming into a wall
    }
  }
  function moveY(amount) {
    pl.ry += amount;
    var move = Math.round(pl.ry);
    if (!move) return;
    pl.ry -= move;
    var s = move > 0 ? 1 : -1;
    while (move) {
      if (!hit(pl.x, pl.y + s)) { pl.y += s; move -= s; continue; }

        scene = 'play'; demo.on = true; demo.stage = 1; demo.f = 0; demo.t0 = 0; demo.back = false; demo.winT = 0; resetRun();
        for (n = 0; n < 4000 && !run.won && !pl.dead; n++) step(demoInput());
        out[starters[i].name] = run.won ? 'won ' + n : (pl.dead ? 'died ' + n : 'ran out ' + n);
      }
      demo.on = false; return out;
    },
    levelProbe: function () { // plays level 1-1 from the map with the demo's inputs, to prove scoring and saving
      startLevel(0, 0); demo.rec = null; demo.stage = 1; demo.f = 0; demo.t0 = 0; demo.back = false;
      var n = 0; while (!run.won && n < 3000) { step(demoInput()); n++; }
      return this.view();
    },
    demoStart: function () { startDemo(); }, demoStep: function (n) { for (var i = 0; i < n; i++) step(demoInput()); return this.state(); },
    chainProbe: function () { // plays room one as a normal run with the demo's inputs, to prove the exit leads to room two
      scene = 'play'; mode = 'endless';
      demo.rec = null; demo.stage = 1; demo.f = 0; demo.t0 = 0; demo.back = false;
      var n = 0, none = { x: 0, y: 0, jump: false, dash: false, grab: false };
      while (run.count === 1 && n < 3000) { step(demoInput()); n++; }
      for (var i = 0; i < 40; i++) step(none);
      return { steps: n, count: run.count, room: room.name, falls: run.deaths, x: pl.x, y: pl.y, pool: pool.length };
    }, load: function (data) { testMode = true; scene = 'play'; buildRoom(data); resetRun(); },
    demoRun: function (n) { startDemo(); demo.room = starters[0]; demo.rec = null; resetRun(); for (var i = 0; i < n && !run.won; i++) step(demoInput()); return { steps: i, won: run.won, deaths: run.deaths, stage: demo.stage }; }
  };
})();
</script>
