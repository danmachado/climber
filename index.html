        var on = i === sel.menu, y = 226 + i * 32;
        box(55, y - 17, 160, 28, on ? C.flame : '#131a33');
        t(MENU[i][0], 135, y + 2, 13, on ? '#1a1205' : C.dim, 'center');
        hits.push({ x: 55, y: y - 17, w: 160, h: 28, fn: (function (k) { return function () { sel.menu = k; MENU[k][2](); }; })(i) });
      }
      t(menuNote || MENU[sel.menu][1], 135, 392, 7, menuNote ? C.flame : C.text, 'center');
      t(usedPad ? 'Up and down to choose   Jump to start' : 'Arrows choose   C or Space starts   or click', 135, 468, 6.5, C.dim, 'center');
    } else {
      var w = sel.w, wd = WORLDS[w], th = THEMES[wd.theme], list = levels[w], open = worldOpen(w), got = 0;
      box(0, 0, LW, LH, th.bg);
      var tot = 0;
      for (i = 0; i < list.length; i++) { tot += hasGem(list[i]) ? 4 : 3; if (prog[list[i].id]) got += prog[list[i].id].stars; }
      t('WORLD ' + wd.id, 135, 34, 8, C.dim, 'center');
      t(wd.name.toUpperCase(), 135, 58, 20, th.accent, 'center');
      star(h, u, 113, 73, 5, C.flame); t(got + ' / ' + tot, 122, 76.5, 8, C.text);
      if (levels[w - 1]) { t('<', 22, 58, 20, C.text, 'center'); hits.push({ x: 4, y: 30, w: 40, h: 44, fn: function () { sel.w--; sel.i = firstOpen(sel.w); lastSig = ''; } }); }
      if (levels[w + 1]) { t('>', 248, 58, 20, C.text, 'center'); hits.push({ x: 226, y: 30, w: 40, h: 44, fn: function () { sel.w++; sel.i = worldOpen(sel.w) ? firstOpen(sel.w) : 0; lastSig = ''; } }); }
      // the path climbs from the bottom of the screen to the top
      for (i = 1; i < list.length; i++) {
        var a = nodePos(i - 1), b = nodePos(i), lit = open && beaten(list[i - 1]);
        box(Math.min(a.x, b.x) - 2, Math.min(a.y, b.y) - 2, Math.abs(a.x - b.x) + 4, Math.abs(a.y - b.y) + 4, lit ? th.accent : '#1c2448');
      }
      for (i = 0; i < list.length; i++) {
        var q = nodePos(i), pr = prog[list[i].id], can = levelOpen(w, i), x0 = q.x - 26, y0 = q.y - 19;
        if (i === sel.i) box(x0 - 4, y0 - 4, 60, 46, C.text);
        box(x0 - 2, y0 - 2, 56, 42, list[i].trial ? th.accentLo : th.bg);   // a trial gets a frame in the world's accent
        box(x0, y0, 52, 38, pr ? th.accent : (can ? '#26315f' : '#141a38'));
        if (can) t(wd.id + '-' + (i + 1), q.x, q.y + 6, 15, pr ? '#101426' : C.text, 'center');
        else { box(q.x - 7, q.y - 3, 14, 12, '#3a4675'); box(q.x - 5, q.y - 10, 10, 3, '#3a4675'); box(q.x - 5, q.y - 10, 3, 8, '#3a4675'); box(q.x + 2, q.y - 10, 3, 8, '#3a4675'); }
        box(q.x - 23, q.y + 23, 46, 14, th.bg);
        var nk = hasGem(list[i]) ? 4 : 3;
        for (var k = 0; k < nk; k++) star(h, u, q.x - (nk - 1) * 6 + k * 12, q.y + 30, nk === 4 ? 4.8 : 5.5, pr && k < pr.stars ? C.flame : '#232c55');
        hits.push({ x: x0 - 4, y: y0 - 4, w: 60, h: 62, fn: (function (n) { return function () { if (sel.i === n) startLevel(sel.w, n); else { sel.i = n; lastSig = ''; } }; })(i) });
      }
      var cur = list[sel.i], cp = cur && prog[cur.id];
      box(0, 430, LW, 50, 'rgba(10,13,28,0.6)');
      if (!list.length) t('No levels here yet', 135, 250, 9, C.dim, 'center');
      else if (!open) t('Finish World ' + WORLDS[w - 1].id + ' to open this one', 135, 448, 8, C.text, 'center');
      else if (!levelOpen(w, sel.i)) t('Beat ' + wd.id + '-' + sel.i + ' first', 135, 448, 8, C.text, 'center');
      else {
        t(((cur.trial ? 'TRIAL: ' : '') + (cur.name || '')).toUpperCase().substring(0, 22), 135, 444, 9, C.text, 'center');
        t((cp ? 'BEST ' + secs(cp.time) + '   ' : '') + 'PAR ' + secs(parOf(cur)), 135, 456, 7, C.dim, 'center');
      }
      t(usedPad ? 'Jump: play   Dash: menu' : 'Arrows move   C plays   X or Esc: menu   or click', 135, 472, 6.5, C.dim, 'center');
    }
    if (check === 1) t(fps.secs < 2 ? 'measuring' : fps.now + ' fps', 135, 10, 7, C.flame, 'center');
    if (wiz.on) drawWiz(u);
  }

  // Screen check: shows what the display is doing, marks the picture's edges, and can lay the tile grid on top.
  function drawCheck(u, t) {
    var i, px = Math.max(1, Math.round(u));
    if (check === 3) {
      for (i = 1; i < cols; i++) { h.fillStyle = i % 5 === 0 ? 'rgba(255,183,74,0.55)' : 'rgba(255,255,255,0.14)'; h.fillRect(Math.round(i * T * u), 0, 1, hud.height); }
      for (i = 1; i < rows; i++) { h.fillStyle = i % 5 === 0 ? 'rgba(255,183,74,0.55)' : 'rgba(255,255,255,0.14)'; h.fillRect(0, Math.round(i * T * u), hud.width, 1); }
    }
    h.fillStyle = C.flame;
    h.fillRect(0, 0, hud.width, px); h.fillRect(0, hud.height - px, hud.width, px);
    h.fillRect(0, 0, px, hud.height); h.fillRect(hud.width - px, 0, px, hud.height);
    var L = 12 * u, w = 3 * u;
    h.fillRect(0, 0, L, w); h.fillRect(0, 0, w, L);
    h.fillRect(hud.width - L, 0, L, w); h.fillRect(hud.width - w, 0, w, L);
    h.fillRect(0, hud.height - w, L, w); h.fillRect(0, hud.height - L, w, L);
    h.fillRect(hud.width - L, hud.height - w, L, w); h.fillRect(hud.width - w, hud.height - L, w, L);
    h.fillStyle = 'rgba(11,16,32,0.88)'; h.fillRect(6 * u, 14 * u, 216 * u, 66 * u);
    t('SCREEN CHECK' + (check === 3 ? '  grid ' + cols + ' x ' + rows : ''), 10, 23, 6, C.flame);
    t('Window ' + view.physW + ' x ' + view.physH + ' px', 10, 33, 7, C.text);
    t('Scale ' + (view.whole ? view.scale + 'x' : view.scale.toFixed(2) + 'x') + ', pixels square: ' + (view.whole ? 'yes' : 'no'), 10, 43, 7, C.text);
    t(fps.secs < 2 ? 'Measuring speed' : fps.now + ' fps now, lowest ' + fps.low, 10, 53, 7, C.text);
    t('Controller: ' + padInfo, 10, 63, 7, C.text);
    t('Next clicks: grid, then controller setup', 10, 73, 6, C.dim);
  }

  // ---- main loop: fixed 60 steps a second so it plays the same on any refresh rate ----
  var last = 0, acc = 0, manual = false;
  function frame(now) {
    var t0 = performance.now();
    if (!manual) {
      var dt = last ? (now - last) / 1000 : STEP;
      last = now;
      acc += Math.min(dt, 0.1);
      fps.frames++; fps.acc += dt;
      if (fps.acc >= 1) {
        fps.now = Math.round(fps.frames / fps.acc); fps.secs++; fps.ms = Math.round(fps.work / fps.frames * 10) / 10; fps.work = 0;
        if (fps.secs === 2 || (fps.secs > 2 && fps.now < fps.low)) fps.low = fps.now;
        fps.frames = 0; fps.acc = 0;
        fps.city = city && cityOn ? city.stats.ev - (fps.cityLast || 0) : -1; fps.cityLast = city ? city.stats.ev : 0;   // city life changes shown in the last second (-1: none here or off)
      }
      var inp = readInput();
      if (wiz.on) { wizTick(); acc = 0; render(); window.requestAnimationFrame(frame); return; }
      var any = inp.x || inp.y || inp.jump || inp.dash || inp.grab || inp.back;
      if (scene !== 'play') {                      // menu or map: nothing moves, so nothing is redrawn until you press something
        if (any) demo.idle = 0;
        else { demo.idle += Math.min(dt, 0.1); if (demo.idle >= DEMO_IDLE || location.hash === '#demo') startDemo(); }
        if (scene === 'settings') settingsTick(inp); else if (scene !== 'play') screenInput(inp);
        acc = 0;
      } else if (demo.on && any) { demo.on = false; toMenu(); navPrev = inp; acc = 0; }
      else {
        if (pause.on) { pauseInput(inp, navPrev); acc = 0; }
        else if (inp.back && !navPrev.back && !testMode && !demo.on && !embedded) { if (run.won && run.result && staged()) leavePlay(); else openPause(); acc = 0; }
        navPrev = inp;
        while (scene === 'play' && !pause.on && acc >= STEP) { step(demo.on ? demoInput() : inp); acc -= STEP; }
      }
    }
    render();
    fps.work += performance.now() - t0;
    window.requestAnimationFrame(frame);
  }

  try { useLive(JSON.parse(localStorage.getItem(LIVE_KEY))); } catch (e) {}
  rebuildLevels();
  resetRun();
  if (!embedded) { fetchLive(); scene = 'menu'; }

  // The room builder runs this same game in a frame and hands it the room being edited.
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'climber-room') return;
    try { buildRoom(d.room); } catch (err) { window.parent.postMessage({ type: 'climber-error', message: String(err.message) }, '*'); return; }
    testMode = true; scene = 'play'; demo.on = false; demo.idle = 0; resetRun(); lastSig = ''; window.focus();
  });
  if (embedded) window.parent.postMessage({ type: 'climber-ready' }, '*');
  setWeather(weather.on);
  layout();
  window.requestAnimationFrame(frame);

  // Hook for the level builder's validator and for automated checks.
  window.__climber = {
    manual: function (on) { manual = on; },
    step: function (inp, n) { for (var i = 0; i < (n || 1); i++) step(inp); return this.state(); },
    state: function () {
      return { x: pl.x, y: pl.y, vx: Math.round(pl.vx), vy: Math.round(pl.vy), state: pl.state, ground: pl.onGround,
               dashes: pl.dashes, stamina: Math.round(pl.stamina), dead: pl.dead, deaths: run.deaths, won: run.won,
               movers: movers.map(function (m) { return { x: m.x, y: m.y, wait: m.wait, z: m.zip ? m.zs : '' }; }),
               fireballs: fireballs.map(function (f) { return { x: f.x, y: f.y, dir: f.dir, wait: f.wait }; }), gem: gotGem(), cam: cam.y,
               keys: roomKeys.map(function (k) { return k.state; }), doors: doors.map(function (d) { return d.open; }),
               jets: jets.map(function (j) { var p = jetPhase(j); return { x: j.x, y: j.y, on: p.on, warn: p.warn, left: p.left }; }), lava: lava ? lava.y : null,
               drones: drones.map(function (d) { return { x: d.x, y: d.y, dir: d.dir, wait: d.wait, fire: d.fire }; }) };
    },
    reset: function () { scene = 'play'; mode = 'endless'; resetRun(); }, kill: die,
    view: function () { return { scene: scene, pause: { on: pause.on, pick: pause.pick }, set: { page: set.page, row: set.row, note: set.note }, mode: mode, sel: sel, lvl: lvl, room: room.name, prog: prog, levels: levels.map(function (l) { return l.map(function (r) { return r.name; }); }), result: run.result, time: run.time }; },
    weather: function (on) { setWeather(on); return weather.on; },
    city: function (on) { if (on === 'ship') { if (city) city.nextShip = ct; } else if (on !== undefined) setCity(on); return { on: cityOn, live: !!city, movers: city ? city.movers.map(function (m) { return { kind: m.kind, x: Math.round(m.x), y: m.y }; }) : [], stats: city ? city.stats : null, lanes: city ? city.lanes.map(function (l) { return l.depth.charAt(1) + l.y; }) : [], chunks: chunkCopies, tick: tick, ms: fps.ms, fps: fps.now }; },
    nav: function (o) { screenInput(Object.assign({ x: 0, y: 0, jump: false, dash: false, grab: false, back: false }, o)); screenInput({ x: 0, y: 0, jump: false, dash: false, grab: false, back: false }); return this.view(); },
    startLevel: startLevel,
    demoAll: function () { // plays every recorded demo to the end, to prove the recordings still reach the exit
      var out = {}, i, n;
      for (i = 0; i < starters.length; i++) {
        demo.room = starters[i]; demo.rec = i ? DEMOS[starters[i].id] : null; if (i && !demo.rec) { out[starters[i].name] = 'no recording'; continue; }
        demo.rk = 0; demo.rleft = demo.rec ? demo.rec[1] : 0;
        scene = 'play'; demo.on = true; demo.stage = 1; demo.f = 0; demo.t0 = 0; demo.back = false; demo.winT = 0; resetRun();
        for (n = 0; n < 4000 && !run.won && !pl.dead; n++) step(demoInput());
        out[starters[i].name] = run.won ? 'won ' + n : (pl.dead ? 'died ' + n : 'ran out ' + n);
      }
      demo.on = false; return out;
    },
    levelProbe: function () { // plays level 1-1 from the map with the demo's inputs, to prove scoring and saving
      startLevel(0, 0); demo.rec = null; demo.stage = 1; demo.f = 0; demo.t0 = 0; demo.back = false;
      var n = 0; while (!run.won && n < 3000) { step(demoInput()); n++; }
      return this.view();
    },
    demoStart: function () { startDemo(); }, demoStep: function (n) { for (var i = 0; i < n; i++) step(demoInput()); return this.state(); },
    chainProbe: function () { // plays room one as a normal run with the demo's inputs, to prove the exit leads to room two
      scene = 'play'; mode = 'endless';
      demo.rec = null; demo.stage = 1; demo.f = 0; demo.t0 = 0; demo.back = false;
      var n = 0, none = { x: 0, y: 0, jump: false, dash: false, grab: false };
      while (run.count === 1 && n < 3000) { step(demoInput()); n++; }
      for (var i = 0; i < 40; i++) step(none);
      return { steps: n, count: run.count, room: room.name, falls: run.deaths, x: pl.x, y: pl.y, pool: pool.length };
    }, load: function (data) { testMode = true; scene = 'play'; buildRoom(data); resetRun(); },
    tune: function (k, v) { var old = P[k]; if (v !== undefined) P[k] = v; return old; },   // tests only: switch a move off to prove a room needs it
    // Save and restore everything the physics reads, so a solver can try many inputs from one moment (tests only).
    snap: function () {
      var cp = function (a) { return a.map(function (o) { return Object.assign({}, o); }); };
      return JSON.parse(JSON.stringify({ pl: pl, run: run, fx: fx, cr: cp(crumbles), mv: cp(movers), fb: cp(fireballs), dn: cp(drones), sp: cp(springs),
        gm: cp(gems), ky: cp(roomKeys), dr: cp(doors), rf: cp(refills), lava: lava ? Object.assign({}, lava) : null }));
    },
    restore: function (s) {
      var put = function (a, b) { for (var i = 0; i < a.length; i++) Object.assign(a[i], b[i]); };
      pl = JSON.parse(JSON.stringify(s.pl)); run = Object.assign({}, s.run); fx = Object.assign({}, s.fx);
      put(crumbles, s.cr); put(movers, s.mv); put(fireballs, s.fb); put(drones, s.dn); put(springs, s.sp);
      put(gems, s.gm); put(roomKeys, s.ky); put(doors, s.dr); put(refills, s.rf); if (lava && s.lava) Object.assign(lava, s.lava);
    },
    demoRun: function (n) { startDemo(); demo.room = starters[0]; demo.rec = null; resetRun(); for (var i = 0; i < n && !run.won; i++) step(demoInput()); return { steps: i, won: run.won, deaths: run.deaths, stage: demo.stage }; }
  };
})();
